name: Auto-evaluate off-site opportunities

# Triggered once per day (09:00 UTC). We use GitHub Actions instead of
# Vercel Cron because the Vercel Hobby plan only allows daily cron
# schedules anyway, and Actions keeps the cron config next to the
# application code (and supports workflow_dispatch for ad-hoc runs).
#
# To change the cadence, edit the cron expression below. Examples:
#   '0 9 * * *'    daily at 09:00 UTC (current)
#   '0 */6 * * *'  every 6 hours
#   '*/30 * * * *' every 30 minutes
#
# Required repository secrets:
#   AUTO_EVAL_ENDPOINT  e.g. https://off-site-dashboard.vercel.app/api/cron/scan-opportunities
#   AUTO_EVAL_TOKEN     matches the CRON_SECRET env var on the Vercel deployment

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auto-evaluate
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets are set
        env:
          AUTO_EVAL_ENDPOINT: ${{ secrets.AUTO_EVAL_ENDPOINT }}
          AUTO_EVAL_TOKEN: ${{ secrets.AUTO_EVAL_TOKEN }}
        run: |
          if [ -z "$AUTO_EVAL_ENDPOINT" ]; then
            echo "::error::Repository secret AUTO_EVAL_ENDPOINT is not set."
            exit 1
          fi
          if [ -z "$AUTO_EVAL_TOKEN" ]; then
            echo "::error::Repository secret AUTO_EVAL_TOKEN is not set."
            exit 1
          fi

      - name: Trigger Vercel auto-evaluation endpoint
        env:
          AUTO_EVAL_ENDPOINT: ${{ secrets.AUTO_EVAL_ENDPOINT }}
          AUTO_EVAL_TOKEN: ${{ secrets.AUTO_EVAL_TOKEN }}
        run: |
          set -eu
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-delay 5 --retry-connrefused \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer ${AUTO_EVAL_TOKEN}" \
            --header 'content-type: application/json' \
            "$AUTO_EVAL_ENDPOINT")"
          echo "HTTP status: $status"
          echo '--- response body ---'
          cat "$response_file"
          echo
          echo '--- end response body ---'
          if [ "$status" != "200" ]; then
            echo "::error::Auto-evaluation endpoint returned HTTP $status"
            exit 1
          fi
